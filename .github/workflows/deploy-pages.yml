name: Desplegar aplicación en GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@iamacalupuenzo-ui'

      - name: Instalar dependencias
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generar aplicación estática
        run: npm run build -- --base-href "/Prueban1/"

      - name: Mantener navegables las rutas de Angular
        run: cp dist/fleet-operations/browser/index.html dist/fleet-operations/browser/404.html

      - name: Preparar artefacto de GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/fleet-operations/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
